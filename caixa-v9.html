function renderGastosBody() {
  const months = getPeriodMonths(
    S.gastosPeriod,
    S.gastosCustom.start,
    S.gastosCustom.end
  );
  if (!months.length) { document.getElementById('gastos-body').innerHTML='<div class="empty-state"><p>Selecione um período válido</p></div>'; return; }

  const allTxByMonth = {};
  const allIncByMonth = {};
  months.forEach(m => {
    allTxByMonth[m]  = getMonthTxDisplay(m);
    allIncByMonth[m] = getIncMonth(m);
  });

  const allTx  = months.flatMap(m => allTxByMonth[m]);
  const allInc = months.flatMap(m => allIncByMonth[m]);
  const nMonths = months.length || 1;

  const totalExp = allTx.reduce((s,t)=>s+(t.val||0),0);
  const totalInc = allInc.reduce((s,i)=>s+(i.net||0),0);
  const avgExp   = totalExp / nMonths;
  const avgInc   = totalInc / nMonths;

  // By category
  const byCat = {};
  allTx.forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+(t.val||0) });

  // Essential vs non-essential
  let essential=0, nonEssential=0;
  Object.entries(byCat).forEach(([cat,val])=>{
    if (ESSENTIAL_CATS.includes(cat)) essential+=val; else nonEssential+=val;
  });

  // Top 8 categories
  const topCats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const otherVal = Object.values(byCat).reduce((s,v)=>s+v,0) - topCats.reduce((s,[,v])=>s+v,0);

  // Bar chart data
  const barData = months.map(m => ({
    month: m,
    income:  allIncByMonth[m].reduce((s,i)=>s+(i.net||0),0),
    expense: allTxByMonth[m].reduce((s,t)=>s+(t.val||0),0),
  }));

  // Payment methods by month
  const methodMonths = months.map(m => {
    const txns = allTxByMonth[m];
    const xp   = txns.filter(t=>t.method==='credit_xp').reduce((s,t)=>s+t.val,0);
    const inter= txns.filter(t=>t.method==='credit_inter').reduce((s,t)=>s+t.val,0);
    const pix  = txns.filter(t=>t.method==='pix').reduce((s,t)=>s+t.val,0);
    return {month:m, 'Cartão XP':xp, 'Cartão Inter':inter, PIX:pix};
  });
  const totXP    = methodMonths.reduce((s,d)=>s+(d['Cartão XP']||0),0);
  const totInter = methodMonths.reduce((s,d)=>s+(d['Cartão Inter']||0),0);
  const totPIX   = methodMonths.reduce((s,d)=>s+(d['PIX']||0),0);
  const totMethods = totXP+totInter+totPIX||1;

  // Budget comparison
  const bud = getBudgets();
  const budCats = Object.keys(bud);

  // Projeção de parcelas (next 12 months)
  const installs = getInst();
  const now = nowMonth();
  const projRows = [];
  for (let i=0; i<12; i++) {
    const pm = addMonths(now, i);
    const pmIdx = monthToIdx(pm);
    const active = installs.filter(inst => {
      const s = monthToIdx(inst.startMonth);
      return pmIdx >= s && pmIdx < s + inst.tot;
    });
    projRows.push({month:pm, total:active.reduce((s,x)=>s+(x.val||0),0), count:active.length});
  }
  const avgProjTotal = projRows.reduce((s,r)=>s+r.total,0) / 12;

  const donutEssSegs = [
    {label:'Essencial',    val:essential,    color:'var(--accent-blue)'},
    {label:'Não Essencial',val:nonEssential,color:'var(--accent-amber)'},
  ];
  const donutCatSegs = [...topCats.map(([c,v],i)=>({label:c,val:v,color:CHART_COLORS[i]})),
    ...(otherVal>0?[{label:'Outros',val:otherVal,color:'#aaa'}]:[])];

  document.getElementById('gastos-body').innerHTML = `
    <!-- KPIs -->
    <div class="kpi-grid" style="margin-bottom:20px">
      <div class="kpi-card">
        <div class="kpi-label">Total Entradas</div>
        <div class="kpi-value green mono">${fmt(totalInc)}</div>
        <div class="kpi-sub">Média ${fmt(avgInc)}/mês</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Saídas</div>
        <div class="kpi-value red mono">${fmt(totalExp)}</div>
        <div class="kpi-sub">Média ${fmt(avgExp)}/mês</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Saldo Período</div>
        <div class="kpi-value ${totalInc-totalExp>=0?'green':'red'} mono">${totalInc-totalExp>=0?'+':''}${fmt(totalInc-totalExp)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Meses</div>
        <div class="kpi-value mono">${nMonths}</div>
        <div class="kpi-sub">${months[0]} → ${months[months.length-1]}</div>
      </div>
    </div>

    <!-- Gráfico 1: Entradas vs Saídas -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Entradas vs Saídas por Mês</div>
      ${svgEntradasSaidasChart(barData, {w:680,h:250})}
    </div>

    <!-- Gráficos 2 e 3 -->
    <div class="row" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">Essencial vs Não Essencial</div>
        <div style="display:flex;align-items:center;gap:16px">
          ${svgDonut(donutEssSegs.filter(s=>s.val>0), 140, 36)}
          <div>
            ${donutEssSegs.map(s=>`<div style="margin-bottom:8px">
              <div class="legend-item" style="margin-bottom:2px"><span class="legend-dot" style="background:${s.color}"></span><strong>${s.label}</strong></div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:13px">${fmt(s.val)}</div>
              <div style="font-size:11px;color:var(--text-tertiary)">${fmt(s.val/nMonths)}/mês · ${fmtPct(totalExp?(s.val/totalExp*100):0)}</div>
            </div>`).join('')}
          </div>
        </div>
        <div style="font-size:11px;color:var(--text-tertiary);margin-top:8px">Essencial: ${ESSENTIAL_CATS.join(', ')}</div>
      </div>

      <div class="card">
        <div class="card-title">Top Categorias</div>
        <div style="display:flex;align-items:center;gap:16px">
          ${svgDonut(donutCatSegs.filter(s=>s.val>0), 140, 36)}
          <div style="flex:1;max-height:180px;overflow-y:auto">
            ${donutCatSegs.map((s,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)">
              <span class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${escHtml(s.label)}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px">${fmt(s.val)} <span style="color:var(--text-tertiary)">${fmtPct(totalExp?s.val/totalExp*100:0)}</span></span>
            </div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <!-- Meios de Pagamento -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Meios de Pagamento</div>
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
        <div class="kpi-card">
          <div class="kpi-label">Cartão XP</div>
          <div class="kpi-value mono">${fmt(totXP)}</div>
          <div class="kpi-sub">${fmtPct(totXP/totMethods*100)}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Cartão Inter</div>
          <div class="kpi-value mono">${fmt(totInter)}</div>
          <div class="kpi-sub">${fmtPct(totInter/totMethods*100)}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">PIX</div>
          <div class="kpi-value mono">${fmt(totPIX)}</div>
          <div class="kpi-sub">${fmtPct(totPIX/totMethods*100)}</div>
        </div>
      </div>
      ${svgStackedBar(methodMonths, ['Cartão XP','Cartão Inter','PIX'], ['#5B3FD4','#2563EB','#1A9E5C'], {w:680,h:160})}
      <div class="chart-legend">
        ${[['Cartão XP','#5B3FD4'],['Cartão Inter','#2563EB'],['PIX','#1A9E5C']].map(([l,c])=>`<span class="legend-item"><span class="legend-square" style="background:${c}"></span>${l}</span>`).join('')}
      </div>
    </div>

    <!-- Gasto vs Orçado -->
    ${budCats.length ? `<div class="card" style="margin-bottom:16px">
      <div class="card-title">Gasto vs Orçado</div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Categoria</th><th class="right">Orçado/mês</th>
            <th class="right">Médio período</th><th class="right">Δ %</th><th>Status</th>
          </tr></thead>
          <tbody>
            ${budCats
              .map(cat => {
                const budVal = bud[cat];
                const spent  = (byCat[cat]||0)/nMonths;
                const delta  = budVal ? (spent-budVal)/budVal*100 : 0;
                const status = spent>budVal?'✗ Acima':spent>budVal*0.8?'⚠ Próximo':'✓ Dentro';
                const sCls   = spent>budVal?'red':spent>budVal*0.8?'amber':'green';
                return {cat,budVal,spent,delta,status,sCls};
              })
              .sort((a,b)=>b.delta-a.delta)
              .map(({cat,budVal,spent,delta,status,sCls})=>`<tr>
                <td><span class="cat-pill">${catIcon(cat)} ${escHtml(cat)}</span></td>
                <td class="right">${fmt(budVal)}</td>
                <td class="right">${fmt(spent)}</td>
                <td class="right" style="color:var(--accent-${delta>0?'red':delta>-20?'amber':'green'})">${delta>=0?'+':''}${fmtPct(delta)}</td>
                <td><span class="badge badge-${sCls}">${status}</span></td>
              </tr>`)
              .join('')}
          </tbody>
        </table>
      </div>
    </div>` : ''}

    <!-- Projeção de Parcelas -->
    <div class="card">
      <div class="card-title">Projeção de Parcelas — Próximos 12 meses</div>
      <div class="table-wrap">
        <table>

            ${projRows.map(r=>`<tr ${r.total>avgProjTotal*1.1?'style="background:#fffbf0"':''}>

              <td class="right ${r.total>avgProjTotal*1.1?'amount-neg':''}">${fmt(r.total)}</td>
              <td class="right">${r.count}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function seedDataIfEmpty() {
  if (localStorage.getItem(LS.tx)) return; // already has data
  if (SEED_DATA.transactions) setTx(SEED_DATA.transactions);
  if (SEED_DATA.installments) setInst(SEED_DATA.installments);
  if (SEED_DATA.income) setInc(SEED_DATA.income);
  if (SEED_DATA.budgets) setBudgets(SEED_DATA.budgets);
}
// One-time migration: replace localStorage installments with corrected SEED_DATA
// (fixes missing methods + removes 5 duplicate _derived entries)
// Guarded by a flag so user-added installments are never wiped on reload
function migrateInstallments() {
  const FLAG = 'caixa_migr_inst_v2';
  if (localStorage.getItem(FLAG)) return;
  if (SEED_DATA.installments) setInst(SEED_DATA.installments);
  localStorage.setItem(FLAG, '1');
}

// Cleanup: remove keys left over from the removed AI assistant feature
function cleanupLegacyKeys() {
  ['caixa_chat_history','caixa_api_key'].forEach(k => localStorage.removeItem(k));
  Object.keys(localStorage)
    .filter(k => k.startsWith('caixa_ai_cache'))
    .forEach(k => localStorage.removeItem(k));
}


// ============================================================
// LOCK SCREEN — dados cifrados com AES-256-GCM (WebCrypto)
// ============================================================
async function decryptPayload(pass) {
  const raw  = Uint8Array.from(atob(SEED_ENCRYPTED), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const mat  = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key  = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'},
    mat, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

function seedFromPayload(p) {
  const s = p.seed || {};
  if (!localStorage.getItem(LS.tx)    && s.transactions) setTx(s.transactions);
  if (!localStorage.getItem(LS.inst)  && s.installments) setInst(s.installments);
  if (!localStorage.getItem(LS.inc)   && s.income)       setInc(s.income);
  if (!localStorage.getItem(LS.bud)   && s.budgets)      setBudgets(s.budgets);
  if (!localStorage.getItem(LS.goals) && p.goals)        setGoals(p.goals);
  if (!localStorage.getItem(LS.port)  && p.portfolio)    setPortfolio(p.portfolio);
  if (!localStorage.getItem(LS.bens)  && p.bens)         setBens(p.bens);
  if (!localStorage.getItem(LS.cfg)   && p.cfg)          setSettings(p.cfg);
  if (p.portfolio) DEFAULT_PORTFOLIO = p.portfolio;
  if (p.goals)     DEFAULT_GOALS     = p.goals;
  if (p.bens)      DEFAULT_BENS      = p.bens;
}

function unlockIfNeeded() {
  const hydrated = [LS.tx, LS.port, LS.goals, LS.bens].every(k => localStorage.getItem(k));
  if (hydrated || !SEED_ENCRYPTED) return Promise.resolve();
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.id = 'lock-screen';
    ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:var(--bg-primary);display:flex;align-items:center;justify-content:center';
    ov.innerHTML = `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:36px;max-width:360px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.12);text-align:center">
        <div style="font-size:34px;margin-bottom:10px">🔒</div>
        <div style="font-size:17px;font-weight:600;margin-bottom:6px">Caixa<span style="color:var(--accent-purple)">.</span></div>
        <div style="font-size:12px;color:var(--text-tertiary);margin-bottom:20px">Dados cifrados com AES-256. Digite sua senha para desbloquear.</div>
        <input type="password" id="lock-pass" class="form-control" placeholder="Senha" autocomplete="current-password"
          style="text-align:center;margin-bottom:10px" onkeydown="if(event.key==='Enter')document.getElementById('lock-btn').click()">
        <button class="btn btn-primary" id="lock-btn" style="width:100%;justify-content:center">Desbloquear</button>
        <div id="lock-err" style="font-size:11px;color:var(--accent-red);margin-top:10px;min-height:14px"></div>
      </div>`;
    document.body.appendChild(ov);
    const input = ov.querySelector('#lock-pass');
    input.focus();
    ov.querySelector('#lock-btn').onclick = async () => {
      const btn = ov.querySelector('#lock-btn');
      btn.disabled = true; btn.textContent = 'Verificando…';
      try {
        const payload = await decryptPayload(input.value);
        seedFromPayload(payload);
        ov.remove();
        resolve();
      } catch(e) {
        btn.disabled = false; btn.textContent = 'Desbloquear';
        ov.querySelector('#lock-err').textContent = 'Senha incorreta.';
        input.select();
      }
    };
  });
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  await unlockIfNeeded();
  seedDataIfEmpty();
  migrateInstallments();
  cleanupLegacyKeys();
  S.month = nowMonth();
  updateMonthLabel();
  renderDashboard();
});
</script>
